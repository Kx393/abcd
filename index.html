    <style>
      html, body {
        background-color: #020617;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
    <link rel="stylesheet" crossorigin href="./assets/index.css">
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>

    <script type="module">
      // Universal static fallback for GitHub Pages:
      // If running on a static host without a Vite dev server, /src/main.tsx won't execute.
      // In that case, immediately load the pre-compiled production bundle from ./assets/index.js!
      setTimeout(function() {
        var root = document.getElementById('root');
        if (!root || !root.hasChildNodes() || root.children.length === 0) {
          var s = document.createElement('script');
          s.type = 'module';
          s.crossOrigin = 'anonymous';
          s.src = './assets/index.js';
          document.body.appendChild(s);
        }
      }, 60);
    </script>
  </body>
